<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinic Notes Login</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="server.css">
</head>
<body class="server-page">
  <main class="login-shell">
    <section class="login-card">
      <img class="login-logo" src="assets/gdanski-chiropractic-logo-balanced.png" alt="Gdanski Chiropractic logo">
      <p class="eyebrow">Private clinic system</p>
      <h1>Clinic Notes</h1>
      <form id="loginForm">
        <label>
          <span>Username</span>
          <input id="username" autocomplete="username" required>
        </label>
        <label>
          <span>Password</span>
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Login</button>
      </form>
      <output id="loginStatus" aria-live="polite"></output>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
