<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinic Notes Dashboard</title>
  <link rel="stylesheet" href="app.css?v=20260528-alerts">
  <link rel="stylesheet" href="initial.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="server.css">
</head>
<body>
  <main class="app-shell dashboard-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <img class="clinic-logo" src="assets/gdanski-chiropractic-logo-balanced.png" alt="Gdanski Chiropractic logo">
      </div>
      <div class="page-title">
        <p class="eyebrow">Staff dashboard</p>
        <h1>Clinic dashboard</h1>
      </div>
      <div class="actions"></div>
    </header>

    <section class="dashboard-workflows">
      <section class="sheet dashboard-task find-patient-task">
        <div class="section-head">
          <h2>Find Patient And Open File</h2>
        </div>
        <label class="dashboard-search-label">
          <span>Search by first name, last name, Jane ID, app patient ID, or birth date</span>
          <input id="patientSearch" placeholder="Example: Allan, Gdanski, 1975-04-12, Jane ID, or P000001" autocomplete="off">
        </label>
        <div id="patientSearchResults" class="patient-search-results"></div>
        <div class="selected-patient-row">
          <div id="selectedPatientCard" class="selected-patient-card" hidden></div>
          <a class="button-link open-file-button is-disabled" id="fileSoap" href="index.html" aria-disabled="true">Open Patient File</a>
        </div>
      </section>

      <section class="sheet dashboard-task">
        <div class="section-head">
          <h2>Add New Patient</h2>
          <span>Manual entry</span>
        </div>
        <div class="dashboard-actions">
          <button type="button" id="startManualPatient">Add a New Patient</button>
        </div>
        <div id="manualPatientForm" class="manual-patient-form" hidden>
          <div class="patient-id-preview">
            <span>New app patient number</span>
            <strong id="manualPatientId">Not assigned yet</strong>
          </div>
          <div class="field-grid three">
            <label>
              <span>First name</span>
              <input id="manualFirstName" autocomplete="off">
            </label>
            <label>
              <span>Middle name</span>
              <input id="manualMiddleName" autocomplete="off">
            </label>
            <label>
              <span>Last name</span>
              <input id="manualLastName" autocomplete="off">
            </label>
            <label>
              <span>Preferred name</span>
              <input id="manualPreferredName" autocomplete="off">
            </label>
            <label>
              <span>Jane patient number</span>
              <input id="manualJanePatientNumber" autocomplete="off">
            </label>
            <label>
              <span>Birth date</span>
              <input id="manualDob" type="date">
            </label>
            <label>
              <span>Age</span>
              <input id="manualPatientAge" inputmode="numeric" readonly>
            </label>
          </div>
          <div class="dashboard-actions">
            <button type="button" id="createManualPatient">Save New Patient</button>
          </div>
          <output id="manualPatientStatus" aria-live="polite"></output>
        </div>
      </section>

      <section class="sheet dashboard-task">
        <div class="section-head">
          <h2>Import Multiple Patients From Jane</h2>
          <span>XLSX batch</span>
        </div>
        <label>
          <span>Jane patient export</span>
          <input id="janeBatchFile" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
        </label>
        <div class="dashboard-actions">
          <button type="button" id="previewJaneBatch">Preview Import</button>
          <button type="button" id="importJaneBatch">Import Patients</button>
        </div>
        <output id="janeBatchStatus" aria-live="polite"></output>
        <div id="janeBatchPreview" class="batch-preview"></div>
      </section>
    </section>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="central-storage.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
